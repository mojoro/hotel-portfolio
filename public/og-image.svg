<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="55%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#060f1f"/>
    </linearGradient>
    <radialGradient id="brassGlow" cx="0.9" cy="0.12" r="0.55">
      <stop offset="0%" stop-color="#c89b5a" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#c89b5a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c89b5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inkGlow" cx="0.08" cy="1" r="0.6">
      <stop offset="0%" stop-color="#1a3866" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a3866" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#fbf9f4" stroke-opacity="0.045" stroke-width="0.5" fill="none"/>
    </pattern>
    <linearGradient id="brassLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c89b5a"/>
      <stop offset="100%" stop-color="#ae8344"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#brassGlow)"/>
  <rect width="1200" height="630" fill="url(#inkGlow)"/>

  <!-- Wordmark -->
  <g transform="translate(80, 80)">
    <circle cx="24" cy="24" r="24" fill="#fbf9f4"/>
    <g transform="translate(7.5, 7.5)" stroke="#0b1f3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M3 28V10L16.5 2.5L30 10V28"/>
      <path d="M3 28H30"/>
      <path d="M12 28V19.5H21V28"/>
    </g>
    <text x="64" y="22" font-family="Fraunces, 'Times New Roman', serif" font-size="22" font-weight="500" fill="#fbf9f4" letter-spacing="-0.3">Hotel Online Marketing</text>
    <text x="64" y="44" font-family="Inter, 'Helvetica Neue', sans-serif" font-size="11" fill="#7a93b8" letter-spacing="2.6">DIRECT BOOKINGS · U.S.</text>
  </g>

  <!-- Top-right discreet pill -->
  <g transform="translate(880, 86)">
    <rect width="240" height="36" rx="18" fill="#fbf9f4" fill-opacity="0.05" stroke="#fbf9f4" stroke-opacity="0.14"/>
    <circle cx="20" cy="18" r="5" fill="#2f6b4f"/>
    <text x="34" y="23" font-family="Inter, 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#d9e1ee" letter-spacing="0.2">0% commission · direct only</text>
  </g>

  <!-- Eyebrow pill -->
  <g transform="translate(80, 218)">
    <rect width="406" height="36" rx="18" fill="#fbf9f4" fill-opacity="0.05" stroke="#fbf9f4" stroke-opacity="0.14"/>
    <circle cx="20" cy="18" r="5" fill="#c89b5a"/>
    <text x="34" y="23" font-family="Inter, 'Helvetica Neue', sans-serif" font-size="13" fill="#d9e1ee" letter-spacing="0.4">7-hotel European portfolio · Now serving U.S. independents</text>
  </g>

  <!-- Headline (two lines; brass highlight under "guests") -->
  <rect x="80" y="424" width="234" height="10" fill="#c89b5a" fill-opacity="0.45"/>
  <text x="80" y="344" font-family="Fraunces, 'Times New Roman', serif" font-size="84" font-weight="500" fill="#fbf9f4" letter-spacing="-2">Stop renting your</text>
  <text x="80" y="432" font-family="Fraunces, 'Times New Roman', serif" font-size="84" font-weight="500" fill="#fbf9f4" letter-spacing="-2">guests from Booking.com.</text>

  <!-- Subhead -->
  <text x="80" y="498" font-family="Inter, 'Helvetica Neue', sans-serif" font-size="22" fill="#b1c1d8" letter-spacing="-0.1">Direct-booking sites for independent U.S. hotels —</text>
  <text x="80" y="530" font-family="Inter, 'Helvetica Neue', sans-serif" font-size="22" fill="#b1c1d8" letter-spacing="-0.1">AI-optimized, conversion-tuned, backed by a 7-hotel portfolio.</text>

  <!-- Bottom stripe + URL -->
  <rect x="80" y="572" width="60" height="3" fill="url(#brassLine)"/>
  <text x="156" y="578" font-family="Inter, 'Helvetica Neue', sans-serif" font-size="13" fill="#7a93b8" letter-spacing="2.4">HOTEL-ONLINE-MARKETING.COM / US</text>
</svg>
